prometheus:
  prometheusSpec:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi

grafana:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
  adminPassword: admin1234

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
  config:
    global:
      resolve_timeout: 5m
    receivers:
    - name: 'default'
    - name: 'torchi'
      webhook_configs:
      - url: 'http://webhook-bridge.monitoring.svc.cluster.local:8080/webhook'
    route:
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'default'
      routes:
      - receiver: 'torchi'
        matchers:
        - namespace =~ "notiflex"

prometheusOperator:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

nodeExporter:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
