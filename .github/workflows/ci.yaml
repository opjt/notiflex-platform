name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

    - name: Build and push image
      run: |
        IMAGE="asia-southeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/notiflex/api:sha-${GITHUB_SHA::7}"
        docker build -f app/Dockerfile -t "$IMAGE" .
        docker push "$IMAGE"
        echo "IMAGE=$IMAGE" >> $GITHUB_ENV

    - name: Update deployment manifest
      run: |
        sed -i "s|asia-southeast1-docker.pkg.dev/.*/notiflex/api:.*|$IMAGE|g" k8s/smb/rollout.yaml
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add k8s/smb/rollout.yaml
        git commit -m "ci: update image to sha-${GITHUB_SHA::7}" || echo "No changes to commit"
        git push
